spring:
  application:
    name: store
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 8000
    refreshTokenExpiration: 604800
  profiles:
    active: dev
stripe:
  secretKey: ${STRIPE_SECRET_KEY}
  wehbookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY}
